version: '3'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "${BACKEND_PORT:-7000}:8000"
    volumes:
      - ./:/app/data
    environment:
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - CSV_PATH=/app/data/Scores with Names.csv
    restart: unless-stopped
    networks:
      - nds-network

  frontend:
    build:
      context: ./frontend
      args:
        - NODE_ENV=production
        - VITE_API_BASE_URL=${BACKEND_URL:-http://backend:8000}/api
    ports:
      - "${FRONTEND_PORT:-7001}:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${BACKEND_URL:-http://backend:8000}/api
    restart: unless-stopped
    networks:
      - nds-network

networks:
  nds-network:
    driver: bridge 